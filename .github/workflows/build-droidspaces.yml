name: Build crDroid Cepheus Droidspaces Kernel

on:
  workflow_dispatch:
    inputs:
      jobs:
        description: "Parallel build jobs"
        default: "4"
        required: true

env:
  ARCH: arm64
  OUT_DIR: out
  DEFCONFIG: cepheus_defconfig
  IMAGE: out/arch/arm64/boot/Image.gz-dtb
  ZIP_NAME: Droidspaces-cepheus-kernel.zip

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout kernel source
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            bc bison flex build-essential git zip cpio rsync \
            clang lld llvm \
            libssl-dev libelf-dev dwarves \
            gcc-aarch64-linux-gnu binutils-aarch64-linux-gnu

      - name: Add Droidspaces config fragment
        run: |
          cat > droidspaces.config <<'EOF'
          CONFIG_SYSCTL=y
          CONFIG_SYSVIPC=y
          CONFIG_POSIX_MQUEUE=y
          CONFIG_NAMESPACES=y
          CONFIG_PID_NS=y
          CONFIG_UTS_NS=y
          CONFIG_IPC_NS=y
          CONFIG_SECCOMP=y
          CONFIG_SECCOMP_FILTER=y
          CONFIG_CGROUPS=y
          CONFIG_CGROUP_DEVICE=y
          CONFIG_CGROUP_PIDS=y
          CONFIG_MEMCG=y
          CONFIG_CGROUP_SCHED=y
          CONFIG_FAIR_GROUP_SCHED=y
          CONFIG_CGROUP_FREEZER=y
          CONFIG_CGROUP_NET_PRIO=y
          CONFIG_DEVTMPFS=y
          CONFIG_DEVTMPFS_MOUNT=y
          CONFIG_OVERLAY_FS=y
          CONFIG_TMPFS_POSIX_ACL=y
          CONFIG_TMPFS_XATTR=y
          CONFIG_FW_LOADER=y
          CONFIG_FW_LOADER_USER_HELPER=y
          CONFIG_FW_LOADER_COMPRESS=y
          CONFIG_NET_NS=y
          CONFIG_VETH=y
          CONFIG_BRIDGE=y
          CONFIG_NETFILTER=y
          CONFIG_BRIDGE_NETFILTER=y
          CONFIG_NETFILTER_ADVANCED=y
          CONFIG_NF_CONNTRACK=y
          CONFIG_IP_NF_IPTABLES=y
          CONFIG_IP_NF_FILTER=y
          CONFIG_NF_NAT=y
          CONFIG_NF_TABLES=y
          CONFIG_IP_NF_TARGET_MASQUERADE=y
          CONFIG_NETFILTER_XT_TARGET_MASQUERADE=y
          CONFIG_NETFILTER_XT_TARGET_TCPMSS=y
          CONFIG_NETFILTER_XT_MATCH_ADDRTYPE=y
          CONFIG_NF_CONNTRACK_NETLINK=y
          CONFIG_NF_NAT_REDIRECT=y
          CONFIG_IP_ADVANCED_ROUTER=y
          CONFIG_IP_MULTIPLE_TABLES=y
          CONFIG_NF_CONNTRACK_IPV4=y
          CONFIG_NF_NAT_IPV4=y
          CONFIG_IP_NF_NAT=y
          # CONFIG_ANDROID_PARANOID_NETWORK is not set
          EOF
          sed -i 's/^          //' droidspaces.config

      - name: Merge kernel config
        run: |
          make O="$OUT_DIR" ARCH="$ARCH" "$DEFCONFIG"
          scripts/kconfig/merge_config.sh -m -O "$OUT_DIR" "$OUT_DIR/.config" droidspaces.config
          make O="$OUT_DIR" ARCH="$ARCH" olddefconfig

      - name: Verify Droidspaces options
        run: |
          grep -E 'CONFIG_(PID_NS|IPC_NS|CGROUP_DEVICE|CGROUP_PIDS|DEVTMPFS|VETH|BRIDGE|NETFILTER|OVERLAY_FS)=y' "$OUT_DIR/.config"
          for key in CONFIG_PID_NS CONFIG_IPC_NS CONFIG_CGROUP_DEVICE CONFIG_CGROUP_PIDS CONFIG_DEVTMPFS CONFIG_VETH CONFIG_BRIDGE CONFIG_NETFILTER CONFIG_OVERLAY_FS; do
            grep -q "^${key}=y$" "$OUT_DIR/.config" || { echo "$key is not enabled"; exit 1; }
          done

      - name: Build Image.gz-dtb
        run: |
          make O="$OUT_DIR" ARCH="$ARCH" \
            LLVM=1 LLVM_IAS=1 \
            CROSS_COMPILE=aarch64-linux-gnu- \
            CLANG_TRIPLE=aarch64-linux-gnu- \
            CC=clang LD=ld.lld AR=llvm-ar NM=llvm-nm \
            OBJCOPY=llvm-objcopy OBJDUMP=llvm-objdump STRIP=llvm-strip \
            -j"${{ inputs.jobs }}" Image.gz-dtb
          test -f "$IMAGE"

      - name: Package AnyKernel3
        run: |
          test -d AnyKernel3
          cp "$IMAGE" AnyKernel3/
          cd AnyKernel3
          zip -r9 "../$ZIP_NAME" . -x .git/\* README.md \*placeholder

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: crdroid-cepheus-droidspaces-kernel
          path: |
            ${{ env.IMAGE }}
            ${{ env.OUT_DIR }}/.config
            ${{ env.ZIP_NAME }}
